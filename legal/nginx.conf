server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'none'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
  location = / { return 302 /privacidade; }
  location = /privacidade { try_files /privacidade/index.html =404; }
  location = /termos-de-uso { try_files /termos-de-uso/index.html =404; }
  location = /exclusao-de-dados { try_files /exclusao-de-dados/index.html =404; }
  location = /privacidade/ { return 301 /privacidade; }
  location = /termos-de-uso/ { return 301 /termos-de-uso; }
  location = /exclusao-de-dados/ { return 301 /exclusao-de-dados; }
  location = /legal.css { try_files $uri =404; }
  location / { return 404; }
}
